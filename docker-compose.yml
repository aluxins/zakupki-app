services:
  purchases:
    container_name: purchases-server
    image: purchases-server:latest
    restart: always
    ports:
      - "81:80"
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./html:/usr/share/nginx/html:delegated
    networks:
      - purchases

  mysql:
    image: mariadb:11
    restart: always
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: purchases
      MYSQL_USER: purchases
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - ./data/mysql:/var/lib/mysql:delegated
    networks:
      - purchases

  redis:
    image: "redis:latest"
    restart: always
    ports:
      - "6389:6379"
    depends_on:
      - purchases
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./data/redis:/data:delegated
    networks:
      - purchases

networks:
  purchases:

volumes:
