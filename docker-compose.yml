services:
  purchases:
    container_name: purchases_server
    image: purchases-server:latest
    restart: always
    ports:
      - "81:80"
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./html:/usr/share/nginx/html:delegated
    networks:
      purchases_network:
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 1024M
        reservations:
          cpus: '0.125'
          memory: 256M

  mysql:
    image: mariadb:11
    restart: always
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: purchases
      MYSQL_USER: purchases
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - ./data/mysql:/var/lib/mysql:delegated
    networks:
      purchases_network:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M
        reservations:
          cpus: '0.125'
          memory: 128M

  redis:
    image: "redis:latest"
    container_name: purchases_redis
    restart: always
    ports:
      - "6381:6379"
    depends_on:
      - purchases
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./data/redis:/data:delegated
    networks:
      purchases_network:
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.01'
          memory: 32M

networks:
  purchases_network:
    name: "purchases_network"
